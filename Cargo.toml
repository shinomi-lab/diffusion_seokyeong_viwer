# 情報拡散ライブビューア（独立ワークスペース）。
# core / runner / util は diffusion_seokyeong からのコピーで、改変しない（ビット一致の基準点）。
[package]
name = "viewer-workspace"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["core", "runner", "util", "sim-api", "sim-wasm", "desktop"]

[workspace.dependencies]
graph-lib = { git = "https://github.com/shinomi-lab/graph-lib.git", tag = "v0.6.1" }
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
serde = "1.0"
serde_with = "3.12.0"
core = { path = "core" }
util = { path = "util" }
anyhow = "1.0"
clap = { version = "4.5.37", features = ["derive"] }

[lib]
path = "src_stub.rs"
