[package]
name = "desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
sim-api = { path = "../sim-api" }
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui_plot = "0.34"
rfd = "0.17"
rayon = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rand = { workspace = true }
parquet = { version = "57.0", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "57.0.0"
arrow-schema = "57.0.0"

[dev-dependencies]
sim-wasm = { path = "../sim-wasm" }
pollster = "0.4"

# wgpu のバックエンド（eframe の wgpu feature だけでは有効にならない）
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "vulkan", "wgsl"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles", "wgsl"] }
